services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checkstock}
      POSTGRES_USER: ${POSTGRES_USER:-checkstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkstock}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-checkstock}:${POSTGRES_PASSWORD:-checkstock}@db:5432/${POSTGRES_DB:-checkstock}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
